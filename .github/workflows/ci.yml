name: CI

on:
  push:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  validate:
    runs-on: ubuntu-latest
    timeout-minutes: 10

    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          python -m pip install -r requirements.txt

      - name: Validate committed release
        run: python src/validate_public_release.py

      - name: Regenerate score outputs
        run: python src/score_platforms.py

      - name: Regenerate visuals
        run: python src/create_visuals.py

      - name: Validate regenerated release
        run: python src/validate_public_release.py

      - name: Run tests
        run: python -m unittest discover -s tests -v

      - name: Verify generated data and visual manifest are current
        run: >-
          git diff --exit-code --
          outputs/platform_scores.csv
          outputs/segment_summary.csv
          outputs/visual_manifest.json
